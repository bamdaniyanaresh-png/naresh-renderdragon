# Pack information and subpacks. The build tool (naresh.py) reads this file.

[pack]
name = "Naresh Render Dragon Shader"
version = [1, 0, 0]
min_engine_version = [1, 26, 60]
description = "Soft clouds, big moon with glow, northern lights, cinematic tone mapping and world light. Made by Naresh."
authors = ["Naresh"]
url = ""
uuid = "e06556d9-c0bd-4550-a5b6-86a370a13fdb"
module_uuid = "393cb308-f8de-4677-8e98-1a105f8f2103"

# Quality subpacks. "define" is passed to the compiler as a macro,
# "materials" are the materials that are compiled again for that subpack.
# A subpack without materials uses the main pack as it is.
# Folders are created as subpacks/<folder>/renderer/materials.

[[subpack]]
name = "Low"
folder = "low"
define = "QUALITY_LOW"
materials = ["RenderChunk"]

[[subpack]]
name = "Ultra"
folder = "ultra"
define = "QUALITY_ULTRA"
materials = ["RenderChunk", "Sky", "Actor", "ActorGlint", "ActorMultiTexture", "ItemInHandColor", "ItemInHandColorGlint", "ItemInHandTextured"]

[[subpack]]
name = "Medium"
folder = "medium"
define = "QUALITY_MEDIUM"
materials = []
